<div class="rw_page">
  <div class="rw_cover"><p class="rw_hint">Scroll down</p></div>
  <div class="rw_track" data-anm-rw-track>
    <section class="rw_stage">
      <div class="rw_wheel" data-anm-rotating-words
        data-anm-scrub="true"
        data-anm-spin="2.4"
        data-anm-settle="0.15"
        data-anm-step="18"
        data-anm-hold="0"
        data-anm-snap="false"
        data-anm-snap-delay="0.1"
        data-anm-start="top 75%"
        data-anm-once="false"
        data-anm-nav="true"
        data-anm-blur="8">
        <ul class="rw_list" data-anm-rw-list>
          <li class="rw_item">Sprint</li>
          <li class="rw_item">Hurdles</li>
          <li class="rw_item">Long jump</li>
          <li class="rw_item">High jump</li>
          <li class="rw_item">Pole vault</li>
          <li class="rw_item">Relay</li>
          <li class="rw_item">Steeplechase</li>
          <li class="rw_item">Decathlon</li>
          <li class="rw_item">Cross country</li>
          <li class="rw_item">Marathon</li>
        </ul>
      </div>
    </section>
  </div>
</div>
